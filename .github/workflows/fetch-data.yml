name: Fetch Football Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year (e.g. 2024)"
        required: true
        default: "2024"

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch football data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/fetch_results.py --season ${{ inputs.season }} --league ALL

      - name: Commit data
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "jarvis-data-bot@users.noreply.github.com"
          git add -f data/raw/*.json
          git diff --cached --quiet && exit 0
          git commit -m "data: fetch season ${{ inputs.season }}"
          git push
